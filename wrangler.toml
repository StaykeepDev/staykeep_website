name = "staykeep-website"
main = "worker/index.ts"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat"]

# Live since 2026-09-24. Both hostnames are proxied DNS records (the apex still
# points at the old Vercel origin), so these routes are what serve the site;
# removing them hands staykeep.com back to the old deployment. www → apex 301
# happens in worker/index.ts.
routes = [
  { pattern = "staykeep.com/*", zone_name = "staykeep.com" },
  { pattern = "www.staykeep.com/*", zone_name = "staykeep.com" },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true
