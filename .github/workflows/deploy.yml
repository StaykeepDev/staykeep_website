name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No CLOUDFLARE_API_TOKEN secret configured yet -> skip deploy with a
      # clear notice instead of failing the workflow.
      - name: Skip deploy (no CLOUDFLARE_API_TOKEN secret)
        if: ${{ !secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN secret is not set. Add it in the repo's Settings > Secrets and variables > Actions, then re-run this workflow (or push to prod again) to deploy."

      - name: Deploy to Cloudflare Workers
        if: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "7521e680ccd219c6aa59ef486ca58a65"
          command: deploy
